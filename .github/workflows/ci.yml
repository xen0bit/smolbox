name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.3"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.18"

      - name: Cache bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}

      - name: Install web deps
        run: bun install --frozen-lockfile

      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.12.2

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test

  wasm-integration:
    name: wasm build + integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.3"

      - name: Cache dist/smolbox.wasm
        uses: actions/cache@v4
        with:
          path: dist/smolbox.wasm
          key: smolbox-wasm-${{ hashFiles('vm/Dockerfile', 'guest/**', 'build/Dockerfile.c2w', 'go.mod', 'go.sum') }}

      - name: Build wasm
        run: make wasm

      - name: Integration tests
        run: make test-integration
