name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.3"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.18"

      - name: Cache bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}

      - name: Install web deps
        run: bun install --frozen-lockfile

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

      - name: Typecheck (tsc)
        run: bunx --bun tsc --noEmit -p web/tsconfig.json

      - name: Unit tests
        run: make test

      - name: Web unit tests (bun)
        run: make test-web

  wasm-integration:
    name: wasm build + integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.3"

      - name: Cache dist/smolbox.wasm
        uses: actions/cache@v4
        with:
          path: dist/smolbox.wasm
          key: smolbox-wasm-${{ hashFiles('vm/Dockerfile', 'guest/**', 'build/Dockerfile.c2w', 'go.mod', 'go.sum') }}

      - name: Build wasm
        run: make wasm

      - name: Integration tests
        run: make test-integration

      - name: Conformance table (wazero driver)
        run: make test-conformance

  browser-e2e:
    name: browser e2e (conformance parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.18"

      - name: Cache bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}

      - name: Install web deps
        run: bun install --frozen-lockfile

      - name: Cache dist/smolbox.wasm
        uses: actions/cache@v4
        with:
          path: dist/smolbox.wasm
          key: smolbox-wasm-${{ hashFiles('vm/Dockerfile', 'guest/**', 'build/Dockerfile.c2w', 'go.mod', 'go.sum') }}

      - name: Build wasm (if not cached)
        run: |
          if [ ! -f dist/smolbox.wasm ]; then
            make wasm
          fi

      - name: Install Chromium
        run: bunx --bun playwright install --with-deps chromium

      - name: E2E (boot + browser conformance table)
        run: make test-e2e

      # Firefox is the browser with no showDirectoryPicker, so it is the only
      # place the <input webkitdirectory> mount fallback is exercised for real.
      # It rides this job because the wasm artifact is already built here.
      - name: Install Firefox
        run: bunx --bun playwright install --with-deps firefox

      - name: E2E (cross-browser folder mount, Firefox)
        run: make test-e2e-firefox

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-wasi
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  emscripten-e2e:
    name: emscripten e2e (--to-js, no mount)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.18"

      - name: Cache bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}

      - name: Install web deps
        run: bun install --frozen-lockfile

      - name: Cache dist/js
        uses: actions/cache@v4
        with:
          path: dist/js
          key: smolbox-js-${{ hashFiles('vm/Dockerfile', 'guest/**', 'build/Dockerfile.c2w', 'go.mod', 'go.sum') }}

      # This job needs dist/js, not dist/smolbox.wasm: `make web` only warns
      # when the WASI artifact is absent.
      - name: Build wasm-js (if not cached)
        run: |
          if [ ! -d dist/js ]; then
            make wasm-js
          fi

      - name: Install Chromium
        run: bunx --bun playwright install --with-deps chromium

      - name: E2E (emscripten boot + non-mount conformance cases)
        run: make test-e2e-js

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-emscripten
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

