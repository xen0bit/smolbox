# The ONLY Python in this repo (PLAN §11.2).
#
# Everything else is Go and bun; this exists because converting Antares to ONNX
# has no JS path — optimum is the exporter and it is Python. Kept in its own
# directory with its own lockfile so `uv run` here cannot leak into any other
# target, and so `make antares-onnx` is the single place that needs it.
[project]
name = "smolbox-tools"
version = "0.1.0"
description = "Antares -> ONNX conversion for smolbox's WebGPU agent"
requires-python = ">=3.11"
dependencies = [
    "optimum-onnx>=0.1.0",
    "transformers>=4.57,<5",
    "onnx>=1.19",
    "onnxruntime>=1.22",
    # Block-wise int4 (MatMulNBits, which ORT-web runs on WebGPU) and the fp16
    # graph conversion. Both are quantization-only deps of onnxruntime that it
    # does not pull in itself.
    "onnx-ir>=0.1",
    "onnxconverter-common>=1.14",
    "safetensors>=0.4",
    "huggingface-hub>=0.28",
    # CPU torch is enough: this converts weights, it does not train. The CUDA
    # wheels are ~3 GB and buy nothing here.
    "torch>=2.4",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
